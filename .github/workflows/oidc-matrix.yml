name: oidc-matrix
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  noenv:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include:
          - {label: j1_lite,    tgt: synkube/lite-argo-apps, perm: '{"contents":"read"}',  scope: target}
          - {label: j3_actions, tgt: synkube/actions,        perm: '{"contents":"read"}',  scope: target}
          - {label: j4_liteall, tgt: synkube/lite-argo-apps, perm: '{"contents":"write"}', scope: all}
          - {label: j5_jwtex,   tgt: synkube/jwt-exchange,   perm: '{"contents":"read"}',  scope: target}
    steps:
      - name: probe
        run: |
          set -uo pipefail
          echo "REPO=${GITHUB_REPOSITORY} REF=${GITHUB_REF} EVENT=${GITHUB_EVENT_NAME}"
          RESP=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://jwt-exchange")
          TOK=$(printf '%s' "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          python3 - "$TOK" <<'PY'
          import sys,base64,json
          t=sys.argv[1]; p=t.split('.')[1]; p+='='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          print("CLAIMS="+json.dumps({k:c.get(k) for k in ["aud","repository","repository_owner","repository_visibility","ref","ref_type","ref_protected","environment","event_name","job_workflow_ref","workflow_ref","sub","runner_environment"]},sort_keys=True))
          PY
          body=$(python3 - "$TOK" "${{ matrix.tgt }}" "${{ matrix.scope }}" "${{ matrix.perm }}" <<'PY'
          import sys,json
          tok,tgt,scope,perm=sys.argv[1:5]
          b={"subject_token":tok,"resource":{"type":"github_repository","id":tgt},"requested":{"github_permissions":json.loads(perm)},"exchange_profile":"github_actions_to_installation"}
          if scope=="all": b["requested"]["installation_repository_scope"]="all"
          print(json.dumps(b))
          PY
          )
          out=$(curl -sS -m 30 -w '\nHTTP=%{http_code}' -X POST https://jwt-exchange.synkube.com/api/v2/exchange/token -H 'Content-Type: application/json' -d "$body")
          echo "EXCH[${{ matrix.label }}] => $(printf '%s' "$out" | tr '\n' ' ' | head -c 900)"
          echo "TOKENLEN=$(printf '%s' "$out" | head -1 | python3 -c 'import sys,json;print(len((json.load(sys.stdin) or {}).get("token","") or ""))' 2>/dev/null || echo 0)"
  envprod:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    steps:
      - name: probe
        run: |
          set -uo pipefail
          echo "REPO=${GITHUB_REPOSITORY} REF=${GITHUB_REF} EVENT=${GITHUB_EVENT_NAME} ENVNAME=production"
          RESP=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://jwt-exchange")
          TOK=$(printf '%s' "$RESP" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          python3 - "$TOK" <<'PY'
          import sys,base64,json
          t=sys.argv[1]; p=t.split('.')[1]; p+='='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          print("CLAIMS="+json.dumps({k:c.get(k) for k in ["aud","repository","ref","ref_type","ref_protected","environment","event_name","job_workflow_ref","sub"]},sort_keys=True))
          PY
          for spec in "lite|synkube/lite-argo-apps" "actions|synkube/actions"; do
            lbl=${spec%%|*}; tgt=${spec#*|}
            body=$(python3 - "$TOK" "$tgt" <<'PY'
          import sys,json
          tok,tgt=sys.argv[1:3]
          print(json.dumps({"subject_token":tok,"resource":{"type":"github_repository","id":tgt},"requested":{"github_permissions":{"contents":"read"}},"exchange_profile":"github_actions_to_installation"}))
          PY
            )
            out=$(curl -sS -m 30 -w '\nHTTP=%{http_code}' -X POST https://jwt-exchange.synkube.com/api/v2/exchange/token -H 'Content-Type: application/json' -d "$body")
            echo "EXCH[envprod_$lbl] => $(printf '%s' "$out" | tr '\n' ' ' | head -c 900)"
          done
