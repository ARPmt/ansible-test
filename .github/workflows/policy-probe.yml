name: policy-probe
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  probe:
    uses: synkube/actions/.github/workflows/deploy.yaml@main
    permissions:
      contents: read
      id-token: write
    with:
      values_path: values/__probe__/none.yaml
      managed_key: __probe__
      version: 0.0.0
      requested_permissions: '{"contents":"read","metadata":"read"}'
